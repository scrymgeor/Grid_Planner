<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GridOS: Edit Task</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="align-items: center; justify-content: center;">

  <div class="retro-window" style="width: 100%; max-width: 480px;">
    <div class="window-header yellow">
      <span>Edit_Task_Dialog.exe</span>
      <div class="window-controls">_ □ ✕</div>
    </div>
    <div class="window-body">
      <h3 class="pixel-font" style="font-size: 24px; margin: 0 0 12px 0;">Modify Task Properties</h3>

      <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST">
        <div class="retro-field">
          <label>Task Title</label>
          <input type="text" name="title" value="{{ task.title }}" class="retro-input" required>
        </div>
        <div class="retro-field-row">
          <div class="retro-field">
            <label>Category</label>
            <input type="text" name="subject" value="{{ task.subject }}" class="retro-input" required>
          </div>
          <div class="retro-field">
            <label>Task Type (OOP)</label>
            <select name="task_type" class="retro-input">
              <option value="ACADEMIC" {% if task.task_type == 'ACADEMIC' %}selected{% endif %}>📚 Academic Task</option>
              <option value="WORK" {% if task.task_type == 'WORK' %}selected{% endif %}>💼 Work / Project</option>
              <option value="FITNESS" {% if task.task_type == 'FITNESS' %}selected{% endif %}>🏋️ Fitness Task</option>
              <option value="GENERAL" {% if task.task_type == 'GENERAL' %}selected{% endif %}>🛠️ General Task</option>
            </select>
          </div>
        </div>
        <div class="retro-field-row">
          <div class="retro-field">
            <label>Estimated Hours</label>
            <input type="number" step="0.5" name="estimated_hours" value="{{ task.estimated_hours }}" class="retro-input" required>
          </div>
          <div class="retro-field">
            <label>Priority Weight</label>
            <select name="priority" class="retro-input">
              <option value="1" {% if task.priority == 1 %}selected{% endif %}>1 - Low</option>
              <option value="3" {% if task.priority == 3 %}selected{% endif %}>3 - Medium</option>
              <option value="5" {% if task.priority == 5 %}selected{% endif %}>5 - Critical</option>
            </select>
          </div>
        </div>
        <div class="retro-field-row">
          <div class="retro-field">
            <label>Deadline (YYYY-MM-DD HH:MM)</label>
            <input type="text" name="deadline" value="{{ task.deadline }}" class="retro-input" required>
          </div>
          <div class="retro-field">
            <label>Metadata</label>
            <input type="text" name="specific_meta" value="{{ task.specific_meta }}" class="retro-input" required>
          </div>
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button type="submit" class="retro-btn teal" style="flex: 1;">[ SAVE CHANGES & RESCHEDULE ]</button>
          <a href="{{ url_for('index') }}" class="retro-btn" style="flex: 0.4;">[ CANCEL ]</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
