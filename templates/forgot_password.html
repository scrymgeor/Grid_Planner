<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid: Password Recovery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="align-items: center; justify-content: center;">

  <div class="retro-window" style="width: 100%; max-width: 360px;">
    <div class="window-header orange">
      <span>Password_Recovery.exe</span>
      <div class="window-controls">_ □ ✕</div>
    </div>
    <div class="window-body">
      <h3 class="pixel-font" style="font-size: 24px; margin: 0 0 8px 0;">Reset Password</h3>
      <p style="font-size: 13px; margin-bottom: 16px;">Enter your email to receive a 6-digit verification code.</p>

      {% if message %}
        <div style="background: var(--retro-yellow); border: 2px solid var(--border-color); padding: 8px; font-size: 12px; margin-bottom: 12px;">
          {{ message }}
        </div>
      {% endif %}

      <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="retro-field">
          <label>Registered Email</label>
          <input type="email" name="email" class="retro-input" placeholder="student@university.edu" required>
        </div>
        <button type="submit" class="retro-btn orange retro-btn-block">[ DISPATCH RESET CODE ]</button>
      </form>

      <div style="margin-top: 16px; text-align: center; font-size: 12px;">
        <a href="{{ url_for('login') }}">← Back to Login</a>
      </div>
    </div>
  </div>

</body>
</html>
