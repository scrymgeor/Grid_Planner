<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid: Verify Code</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="align-items: center; justify-content: center;">

  <div class="retro-window" style="width: 100%; max-width: 360px;">
    <div class="window-header teal">
      <span>Verify_OTP.exe</span>
      <div class="window-controls">_ □ ✕</div>
    </div>
    <div class="window-body">
      <h3 class="pixel-font" style="font-size: 24px; margin: 0 0 8px 0;">Verify Code & Reset</h3>

      {% if error %}
        <div style="background: var(--retro-pink); border: 2px solid var(--border-color); padding: 6px; font-size: 12px; margin-bottom: 12px; font-weight: bold;">
          {{ error }}
        </div>
      {% endif %}

      <form action="{{ url_for('reset_password') }}" method="POST">
        <input type="hidden" name="email" value="{{ email }}">
        <div class="retro-field">
          <label>6-Digit Verification Code</label>
          <input type="text" name="otp" class="retro-input pixel-font" style="font-size: 22px; text-align: center; letter-spacing: 4px;" placeholder="123456" required>
        </div>
        <div class="retro-field">
          <label>New Password</label>
          <input type="password" name="new_password" class="retro-input" required>
        </div>
        <button type="submit" class="retro-btn teal retro-btn-block">[ UPDATE PASSWORD ]</button>
      </form>
    </div>
  </div>

</body>
</html>
